<app-header
  [itemCount]="cart.itemCount()"
  (navigate)="navigate($event)"
  (bagRequested)="openBag()"
/>

<main>
  @if (view() === 'inicio') {
    <app-inicio (navigate)="navigate($event)" />
  } @else if (view() === 'catalogo') {
    @defer (when view() === 'catalogo') {
      <app-catalogo
        [coffees]="filteredCoffees()"
        [totalCount]="coffees.length"
        [selectedGroup]="selectedGroup()"
        (groupSelected)="selectedGroup.set($event)"
        (coffeeSelected)="openCoffee($event)"
        (addRequested)="addToBag($event)"
      />
    }
  } @else if (view() === 'detalle') {
    @defer (when view() === 'detalle') {
      <app-detalle
        [coffee]="selectedCoffee()"
        (backRequested)="navigate('catalogo')"
        (addRequested)="addToBag($event)"
      />
    }
  } @else {
    <app-origen />
  }
</main>

<app-footer (navigate)="navigate($event)" />
<app-bottom-nav (navigate)="navigate($event)" (bagRequested)="openBag()" />

@if (bagOpen()) {
  @defer (when bagOpen()) {
    <app-bag
      (closeRequested)="bagOpen.set(false)"
      (catalogRequested)="navigate('catalogo')"
    />
  }
}
