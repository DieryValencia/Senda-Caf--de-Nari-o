<app-header (navigate)="navigate($event)" />

<main>
  @if (view() === 'inicio') {
    <app-inicio (navigate)="navigate($event)" />
  } @else if (view() === 'catalogo') {
    @defer (when view() === 'catalogo') {
      <app-catalogo
        [coffees]="filteredCoffees()"
        [totalCount]="coffees.length"
        [selectedGroup]="selectedGroup()"
        (groupSelected)="selectedGroup.set($event)"
        (coffeeSelected)="openCoffee($event)"
      />
    }
  } @else if (view() === 'detalle') {
    @defer (when view() === 'detalle') {
      <app-detalle [coffee]="selectedCoffee()" (backRequested)="navigate('catalogo')" />
    }
  } @else {
    <app-origen />
  }
</main>

<app-footer (navigate)="navigate($event)" />
<app-bottom-nav (navigate)="navigate($event)" />
