<div class="announcement">Envío nacional sin costo desde $100.000</div>

<header class="site-header">
  <button
    class="icon-button mobile-only"
    type="button"
    [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()
  ">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
  </button>

  <button class="brand" type="button" aria-label="Ir al inicio" (click)="navigate.emit('inicio')">
    <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
    <span>SENDA<small>CAFÉ DE NARIÑO</small></span>
  </button>

  <nav class="desktop-nav" aria-label="Navegación principal">
    <button type="button" (click)="navigate.emit('inicio')">Inicio</button>
    <button type="button" (click)="navigate.emit('catalogo')">Cafés</button>
    <button type="button" (click)="navigate.emit('origen')">Origen</button>
  </nav>

  <div class="header-actions">
    @if (isLoggedIn()) {
      <a class="account desktop-account" href="/login" (click)="$event.preventDefault(); logout()">
        <span>Hola, {{ user()?.name }}</span>
        <small>Cerrar sesión</small>
      </a>
      <button class="bag-button" type="button" aria-label="Abrir bolsa de compra" (click)="bagRequested.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 8.5h11l1 12h-13l1-12Z" />
          <path d="M9 9V6a3 3 0 0 1 6 0v3" />
        </svg>
        @if (itemCount() > 0) {
          <span class="bag-count" aria-live="polite">{{ itemCount() }}</span>
        }
      </button>
    } @else {
      <a class="account desktop-account" href="/login" (click)="$event.preventDefault(); navigate.emit('login')">Ingresar</a>
      <a class="account desktop-account" href="/register" (click)="$event.preventDefault(); navigate.emit('register')">Registrarse</a>
      <button class="bag-button" type="button" aria-label="Abrir bolsa de compra" (click)="bagRequested.emit()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6.5 8.5h11l1 12h-13l1-12Z" />
          <path d="M9 9V6a3 3 0 0 1 6 0v3" />
        </svg>
        @if (itemCount() > 0) {
          <span class="bag-count" aria-live="polite">{{ itemCount() }}</span>
        }
      </button>
    }
  </div>
</header>

@if (menuOpen()) {
  <nav class="mobile-menu" aria-label="Navegación móvil">
    <button type="button" (click)="navigate.emit('inicio')">Inicio</button>
    <button type="button" (click)="navigate.emit('catalogo')">Catálogo</button>
    <button type="button" (click)="navigate.emit('origen')">Origen</button>
    @if (isLoggedIn()) {
      <a href="/login" (click)="$event.preventDefault(); logout()">Mi cuenta / Cerrar sesión</a>
    } @else {
      <a href="/login" (click)="$event.preventDefault(); navigate.emit('login')">Ingresar</a>
      <a href="/register" (click)="$event.preventDefault(); navigate.emit('register')">Crear cuenta</a>
    }
  </nav>
}
