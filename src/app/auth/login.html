<div class="login-container">
  <h2>Iniciar sesión</h2>

  <form (ngSubmit)="onSubmit()" [ngClass]='{"was-validated": submitted}'>
    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        required
        class="form-control"
        placeholder="ejemplo@senda.coffee"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        required
        minlength="6"
        class="form-control"
        placeholder="Mínimo 6 caracteres"
      />
    </div>

    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>

  @if (error) {
    <div class="alert alert-error">{{ error }}</div>
  }

  <p class="auth-switch">
    ¿No tienes cuenta?
    <a href="/register" (click)="$event.preventDefault(); goToRegister.emit()">Créala aquí</a>
  </p>
</div>
