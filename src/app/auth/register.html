<div class="register-container">
  <h2>Crear cuenta</h2>

  <form (ngSubmit)="onSubmit()" [ngClass]='{"was-validated": submitted}'>
    <div class="form-group">
      <label for="name">Nombre completo</label>
      <input
        type="text"
        id="name"
        [(ngModel)]="name"
        name="name"
        required
        class="form-control"
        placeholder="Juan Pérez"
      />
    </div>

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="email"
        name="email"
        required
        email
        class="form-control"
        placeholder="ejemplo@senda.coffee"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        [(ngModel)]="password"
        name="password"
        required
        minlength="6"
        class="form-control"
        placeholder="Mínimo 6 caracteres"
      />
    </div>

    <button type="submit" class="btn btn-primary w-100">Crear cuenta</button>
  </form>

  @if (error) {
    <div class="alert alert-error">{{ error }}</div>
  }

  <p class="auth-switch">
    ¿Ya tienes cuenta?
    <a href="/login" (click)="$event.preventDefault(); goToLogin.emit()">Inicia sesión</a>
  </p>
</div>
